[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "soorin-stt"
version = "0.1.0"
description = "Offline-first Persian speech-to-text service with pluggable CPU backends"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1", "pydantic>=2.8,<3",
  "pydantic-settings>=2.5,<3", "python-multipart>=0.0.12,<1",
  "numpy>=1.26,<3", "soundfile>=0.12,<1", "scipy>=1.13,<2",
  "PyYAML>=6,<7", "huggingface-hub>=0.27,<2", "httpx>=0.27,<1",
  "prometheus-client>=0.21,<1", "psutil>=6,<9"
]
[project.optional-dependencies]
sherpa = ["sherpa-onnx>=1.12,<2"]
whisper = ["faster-whisper>=1.1,<2", "ctranslate2>=4.4,<5"]
vosk = ["vosk>=0.3.45,<1"]
transformers = ["torch>=2.3,<3", "transformers>=4.46,<6", "accelerate>=1,<2"]
qwen = ["qwen-asr>=0.0.1"]
eval = ["jiwer>=3,<5"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "httpx>=0.27,<1", "websockets>=13,<17"]
dev = ["ruff>=0.8,<1", "mypy>=1.12,<2", "pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
soorin-stt = "soorin_stt.main:serve"
soorin-models = "soorin_stt.models_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/soorin_stt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 105
target-version = "py311"

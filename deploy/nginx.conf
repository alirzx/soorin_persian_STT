# Studio only: protect externally with organization SSO and HTTPS.
# No service API key is embedded in browser JavaScript.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    # Internal operational endpoints must not be exposed by Studio.
    location = /api/metrics { return 404; }
    location = /api/docs { return 404; }
    location = /api/redoc { return 404; }
    location = /api/openapi.json { return 404; }

    location /api/ {
        proxy_pass http://stt-api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_send_timeout 130s;
        proxy_read_timeout 650s;
        proxy_buffering off;
        client_max_body_size 32m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

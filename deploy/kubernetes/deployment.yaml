# Reference template only: supply image, PVC, Secret, network policy and ingress.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: soorin-stt
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: soorin-stt}
  template:
    metadata:
      labels: {app: soorin-stt}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: api
          image: registry.example.internal/soorin-stt:0.1.0
          envFrom:
            - configMapRef: {name: soorin-stt-config}
            - secretRef: {name: soorin-stt-secrets}
          env:
            - {name: HOME, value: /tmp}
            - {name: XDG_CACHE_HOME, value: /tmp/.cache}
          ports: [{name: http, containerPort: 8080}]
          resources:
            requests: {cpu: '2', memory: 1Gi}
            limits: {cpu: '4', memory: 3Gi}
          volumeMounts:
            - {name: models, mountPath: /opt/models/stt, readOnly: true}
            - {name: runtime-tmp, mountPath: /tmp}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 20
      volumes:
        - name: models
          persistentVolumeClaim: {claimName: soorin-stt-models}
        - name: runtime-tmp
          emptyDir: {sizeLimit: 256Mi}

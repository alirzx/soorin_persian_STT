apiVersion: apps/v1
kind: Deployment
metadata:
  name: soorin-stt
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: soorin-stt}
  template:
    metadata:
      labels: {app: soorin-stt}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: api
          image: registry.example.internal/soorin-stt:0.1.0
          envFrom:
            - configMapRef: {name: soorin-stt-config}
            - secretRef: {name: soorin-stt-secrets}
          ports: [{name: http, containerPort: 8080}]
          resources:
            requests: {cpu: '2', memory: 1Gi}
            limits: {cpu: '4', memory: 2Gi}
          volumeMounts:
            - {name: models, mountPath: /opt/models/stt, readOnly: true}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 15
      volumes:
        - name: models
          persistentVolumeClaim: {claimName: soorin-stt-models}

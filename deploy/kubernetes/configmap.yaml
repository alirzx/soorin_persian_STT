apiVersion: v1
kind: ConfigMap
metadata:
  name: soorin-stt-config
data:
  APP_ENV: production
  STT_MODEL: shenava-koochik
  STT_MODEL_DIR: /opt/models/stt
  STT_CATALOG_DIR: /app/configs/models
  STT_DEVICE: cpu
  STT_CPU_THREADS: '4'
  STT_OFFLINE: 'true'
  STT_WARMUP: 'true'
  STT_REQUIRE_MODEL_PIN: 'true'
  STT_VERIFY_HASHES: 'true'
  APP_INFERENCE_CONCURRENCY: '1'
  STREAM_MAX_SESSIONS: '2'
  APP_HOST: 0.0.0.0
  APP_PORT: '8080'
# APP_API_KEY comes from a Secret, never this ConfigMap.

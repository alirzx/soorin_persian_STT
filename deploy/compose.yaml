# Single warm-loaded CPU model, shared by Soorin products over the soorin-ai network.
# Prepare the external network with: ./scripts/deploy/prepare-network.sh
# Start only the API by default; --profile studio --profile secure enables LAN/VPN HTTPS.
name: soorin-stt

services:
  stt-api:
    image: ${SOORIN_STT_API_IMAGE:-soorin-stt-api:local}
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
    env_file:
      - ../.env
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "8080"
      STT_MODEL_DIR: /opt/models/stt
      STT_CATALOG_DIR: /app/configs/models
      STT_OFFLINE: "true"
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/.cache
    volumes:
      - ../models/downloads:/opt/models/stt:ro
    # Do not expose the unauthenticated service on the LAN by default.
    # Other product containers use http://stt-api:8080 within soorin-ai.
    ports:
      - "${STT_BIND_HOST:-127.0.0.1}:${APP_PORT:-8080}:8080"
    init: true
    stop_grace_period: 40s
    cpus: ${DOCKER_STT_CPUS:-4.0}
    mem_limit: ${DOCKER_STT_MEMORY_LIMIT:-3g}
    memswap_limit: ${DOCKER_STT_MEMORY_SWAP_LIMIT:-3g}
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - soorin-ai

  # Development/trusted-internal studio only. Does not manage API keys or SSO.
  stt-ui:
    profiles: ["studio"]
    image: ${SOORIN_STT_UI_IMAGE:-soorin-stt-ui:local}
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.ui
    ports:
      - "${UI_BIND_HOST:-127.0.0.1}:${UI_PORT:-3015}:80"
    depends_on:
      stt-api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,nosuid,nodev,size=32m
      - /var/run:rw,nosuid,nodev,size=8m
      - /tmp:rw,nosuid,nodev,size=16m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - soorin-ai

  # Optional HTTPS ingress for LAN/VPN browsers. No shared login by default.
  # Keep browser-facing HTTP UI/API ports on loopback in this profile.
  stt-https:
    profiles: ["secure"]
    image: caddy:2.10-alpine
    env_file:
      - ../.env
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        case "$$STT_TLS_MODE" in internal|files) ;; *) echo 'Unsupported STT_TLS_MODE' >&2; exit 1 ;; esac;
        case "$$STT_AUTH_MODE" in none|basic) ;; *) echo 'Unsupported STT_AUTH_MODE' >&2; exit 1 ;; esac;
        exec caddy run --config "/etc/caddy/Caddyfile.$$STT_TLS_MODE" --adapter caddyfile
    ports:
      - "${STT_HTTPS_BIND_HOST:-127.0.0.1}:${STT_HTTPS_PORT:-3443}:8443"
    volumes:
      - ./caddy:/etc/caddy:ro
      - ${STT_TLS_CERT_DIR:-../certs}:/certs:ro
      - stt_https_data:/data
      - stt_https_config:/config
    depends_on:
      stt-ui:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    networks:
      - soorin-ai

networks:
  soorin-ai:
    name: ${SOORIN_STT_NETWORK:-soorin-ai}
    external: true

volumes:
  stt_https_data:
  stt_https_config:

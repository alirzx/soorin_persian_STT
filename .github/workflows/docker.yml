name: Container build and deployment config
on:
  push:
    branches: [main]
    paths:
      - 'deploy/**'
      - 'src/**'
      - 'ui/**'
      - 'pyproject.toml'
      - 'README.md'
      - '.dockerignore'
      - '.env.example'
      - '.github/workflows/docker.yml'
      - 'scripts/deploy/**'
      - 'tests/unit/test_deployment.py'
      - 'tests/unit/test_https_config.py'
      - 'tests/fixtures/mock_stt_api.py'
  pull_request:
    paths:
      - 'deploy/**'
      - 'src/**'
      - 'ui/**'
      - 'pyproject.toml'
      - 'README.md'
      - '.dockerignore'
      - '.env.example'
      - '.github/workflows/docker.yml'
      - 'scripts/deploy/**'
      - 'tests/fixtures/mock_stt_api.py'
  workflow_dispatch:
jobs:
  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose --env-file .env -f deploy/compose.yaml config --quiet
          docker compose --env-file .env -f deploy/compose.yaml --profile studio config --quiet
          docker compose --env-file .env -f deploy/compose.yaml --profile studio --profile secure config --quiet
          python3 scripts/deploy/check_https.py
      - name: Verify internal HTTPS gateway syntax
        run: docker run --rm --network none -e STT_HTTPS_HOST=localhost -e STT_AUTH_MODE=none -v "$PWD/deploy/caddy:/etc/caddy:ro" caddy:2.10-alpine caddy adapt --config /etc/caddy/Caddyfile.internal --adapter caddyfile >/dev/null
      - name: Verify authenticated public-alias Caddy syntax
        run: |
          docker run --rm --network none -e STT_HTTPS_HOST=127.0.0.1 -e STT_PUBLIC_HTTPS_HOST=198.51.100.25 -e STT_HTTPS_USER=smoke -e 'STT_HTTPS_PASSWORD_HASH=$2a$12$aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' -v "$PWD/deploy/caddy:/etc/caddy:ro" caddy:2.10-alpine caddy adapt --config /etc/caddy/Caddyfile.internal-public --adapter caddyfile >/dev/null
      - name: Verify certificate-file HTTPS gateway syntax
        run: docker run --rm --network none -e STT_HTTPS_HOST=localhost -e STT_AUTH_MODE=none -v "$PWD/deploy/caddy:/etc/caddy:ro" caddy:2.10-alpine caddy adapt --config /etc/caddy/Caddyfile.files --adapter caddyfile >/dev/null
      - name: Test IP-address HTTPS handshake behind Docker published port
        run: |
          set -eu
          docker run --name soorin-stt-caddy-ip-smoke --rm -d \
            -p 127.0.0.1:19443:8443 \
            -e STT_HTTPS_HOST=127.0.0.1 \
            -e STT_AUTH_MODE=none \
            -v "$PWD/deploy/caddy:/etc/caddy:ro" \
            -v /data -v /config \
            --read-only --tmpfs /tmp \
            --cap-drop ALL --cap-add NET_BIND_SERVICE \
            --security-opt no-new-privileges:true \
            --entrypoint /bin/sh caddy:2.10-alpine \
            -ec 'exec caddy run --config /etc/caddy/Caddyfile.internal --adapter caddyfile'
          trap 'docker logs soorin-stt-caddy-ip-smoke; docker rm -f soorin-stt-caddy-ip-smoke >/dev/null 2>&1 || true' EXIT
          python3 - <<'PY'
          import ssl, socket, time
          context = ssl._create_unverified_context()
          for i in range(25):
              try:
                  with socket.create_connection(('127.0.0.1',19443),timeout=3) as tcp:
                      with context.wrap_socket(tcp) as tls:
                          assert tls.version() in ('TLSv1.2','TLSv1.3')
                  print('TLS handshake without SNI passed (IP through Docker NAT)')
                  break
              except (OSError, ssl.SSLError):
                  if i == 24:
                      raise
                  time.sleep(1)
          PY
      - name: Build backend image
        run: docker build -f deploy/docker/Dockerfile -t soorin-stt-api:test .
      - name: Build studio image
        run: docker build -f deploy/docker/Dockerfile.ui -t soorin-stt-ui:test .
      - name: Smoke test public Host alias and Basic Auth against built Studio image
        run: |
          set -euo pipefail
          docker network create soorin-stt-alias-smoke
          trap 'docker logs soorin-stt-api-alias-smoke || true; docker logs soorin-stt-ui-alias-smoke || true; docker logs soorin-stt-caddy-alias-smoke || true; docker rm -f soorin-stt-caddy-alias-smoke soorin-stt-ui-alias-smoke soorin-stt-api-alias-smoke >/dev/null 2>&1 || true; docker network rm soorin-stt-alias-smoke >/dev/null 2>&1 || true' EXIT
          # Nginx resolves the stt-api upstream during startup. The test network
          # must provide this DNS alias, even when only testing static UI routing.
          docker run -d --name soorin-stt-api-alias-smoke --network soorin-stt-alias-smoke --network-alias stt-api -v "$PWD/tests/fixtures/mock_stt_api.py:/mock_stt_api.py:ro" python:3.12-alpine python -u /mock_stt_api.py
          for i in $(seq 1 30); do
            if docker exec soorin-stt-api-alias-smoke python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=2)" >/dev/null 2>&1; then
              echo "Mock stt-api is ready"
              break
            fi
            if [ "$i" = 30 ]; then docker logs soorin-stt-api-alias-smoke; exit 1; fi
            sleep 1
          done
          docker run -d --name soorin-stt-ui-alias-smoke --network soorin-stt-alias-smoke --network-alias stt-ui soorin-stt-ui:test
          # A started container is not necessarily an HTTP-ready Nginx process.
          # Previously the first authenticated request raced startup and returned 502.
          for i in $(seq 1 30); do
            if docker exec soorin-stt-ui-alias-smoke wget -q -O /dev/null http://127.0.0.1:80/ 2>/dev/null; then
              echo "Studio Nginx is ready"
              break
            fi
            if [ "$i" = 30 ]; then
              docker logs soorin-stt-ui-alias-smoke
              echo "Studio Nginx failed to become ready"
              exit 1
            fi
            sleep 1
          done
          PW="test-only-password-not-a-secret"
          HASH="$(docker run --rm caddy:2.10-alpine caddy hash-password --plaintext "$PW")"
          docker run -d --name soorin-stt-caddy-alias-smoke --network soorin-stt-alias-smoke -p 127.0.0.1:19444:8443 -e STT_HTTPS_HOST=127.0.0.1 -e STT_PUBLIC_HTTPS_HOST=198.51.100.25 -e STT_HTTPS_USER=smoke -e "STT_HTTPS_PASSWORD_HASH=$HASH" -v "$PWD/deploy/caddy:/etc/caddy:ro" -v /data -v /config --read-only --tmpfs /tmp --cap-drop ALL --cap-add NET_BIND_SERVICE --security-opt no-new-privileges:true --entrypoint /bin/sh caddy:2.10-alpine -ec 'exec caddy run --config /etc/caddy/Caddyfile.internal-public --adapter caddyfile'
          for i in $(seq 1 30); do
            code="$(curl -ks -o /dev/null -w '%{http_code}' -H 'Host:198.51.100.25:35942' https://127.0.0.1:19444/ || true)"
            if [ "$code" = 401 ]; then break; fi
            if [ "$i" = 30 ]; then echo "Public alias did not start as 401: $code"; exit 1; fi
            sleep 1
          done
          [ "$(curl -ks -o /dev/null -w '%{http_code}' -H 'Host:127.0.0.1:3443' https://127.0.0.1:19444/)" = 401 ]
          curl -kfsS -u "smoke:$PW" -H 'Host:198.51.100.25:35942' https://127.0.0.1:19444/ | grep -q '<div id="root"'
          curl -kfsS -u "smoke:$PW" -H 'Host:127.0.0.1:3443' https://127.0.0.1:19444/ | grep -q '<div id="root"'
          # Assert both Host aliases pass the real nginx /api/ reverse proxy.
          for host in "198.51.100.25:35942" "127.0.0.1:3443"; do
            curl -kfsS -u "smoke:$PW" -H "Host:$host" https://127.0.0.1:19444/api/health/ready | python3 -c "import json,sys; obj=json.load(sys.stdin); assert obj['ready'] is True and obj['model'] == 'ci-mock'"
            [ "$(curl -ks -o /dev/null -w '%{http_code}' -H "Host:$host" https://127.0.0.1:19444/api/health/ready)" = 401 ]
          done
